name: meon_kyc
description: Meon KYC - Flutter app for KYC workflow forms
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  file_picker: ^10.3.10
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  fluttertoast: ^8.2.8
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  internet_connection_checker_plus: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
